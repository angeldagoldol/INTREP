<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you — order received</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{--bg:#fbfbf9;--surface:#fff;--border:#e4e2dc;--text:#14140f;--muted:#5b5951;--accent:#1b4d3e;--accent-contrast:#fff;--focus:#2f6fed}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0c;--surface:#171715;--border:#262622;--text:#f5f4f0;--muted:#a9a69c;--accent:#4fd1a5;--accent-contrast:#0e0e0c;--focus:#6f9dff}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px}
  .card{max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;text-align:center}
  h1{margin:0 0 10px;font-size:21px}
  p{margin:0 0 20px;color:var(--muted)}
  a{display:inline-block;min-height:44px;line-height:44px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-contrast);text-decoration:none;font-weight:600}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  code{font-size:12px;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
  <div class="card">
    <h1>Thank you — order received</h1>
    <p>Your payment went through and a confirmation is on its way. We have been notified and will be in touch about delivery.</p>
    <a href="/">Back to the store</a>
    <p style="margin:20px 0 0"><code id="ref"></code></p>
  </div>
  <script>
    const id = new URLSearchParams(location.search).get("session_id");
    if (id) document.getElementById("ref").textContent = "Reference: " + id;
  </script>
</body>
</html>
