<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Store — Checkout Reference</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --bg:#fbfbf9; --surface:#fff; --border:#e4e2dc; --text:#14140f;
    --muted:#5b5951; --accent:#1b4d3e; --accent-contrast:#fff; --focus:#2f6fed;
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0e0e0c; --surface:#171715; --border:#262622; --text:#f5f4f0;
    --muted:#a9a69c; --accent:#4fd1a5; --accent-contrast:#0e0e0c; --focus:#6f9dff;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px 16px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px;font-size:14px}
  .banner{background:color-mix(in srgb,var(--focus) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--focus) 35%,transparent);
    border-radius:var(--radius);padding:12px 14px;font-size:14px;margin:0 0 24px}
  ul{list-style:none;padding:0;margin:0 0 24px}
  li{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap}
  .name{flex:1;min-width:180px;font-weight:600}
  .brand{display:block;font-weight:400;color:var(--muted);font-size:13px}
  .price{white-space:nowrap;font-variant-numeric:tabular-nums}
  input[type=number]{width:64px;min-height:44px;padding:6px 8px;font:inherit;
    border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
  button{min-height:44px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer;
    border-radius:999px;border:1px solid transparent;background:var(--accent);
    color:var(--accent-contrast)}
  button[disabled]{opacity:.55;cursor:not-allowed}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .total{display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);flex-wrap:wrap}
  .err{color:#b3261e;margin:12px 0 0;font-size:14px}
  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);
    color:var(--muted);font-size:13px}
  footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>Checkout reference</h1>
  <p class="sub">Prices come from the server. The browser only ever sends product ids and quantities.</p>

  <p class="banner" id="mode">Loading products…</p>

  <form id="shop">
    <ul id="items"></ul>
    <div class="total">
      <strong>Total: <span id="total">—</span></strong>
      <button type="submit" id="buy" disabled>Checkout with Stripe</button>
    </div>
    <p class="err" id="err" hidden></p>
  </form>

  <footer>
    <p><a href="/legal/terms.md">Terms</a> ·
       <a href="/legal/privacy-policy.md">Privacy</a> ·
       <a href="/legal/refund-policy.md">Refunds</a></p>
    <p>All product names, logos and brands are property of their respective owners.
       Product names are used for identification only.</p>
  </footer>
</div>

<script type="module">
const fmt = (minor, cur) =>
  new Intl.NumberFormat("en-GB", { style:"currency", currency:cur.toUpperCase() }).format(minor/100);

const itemsEl = document.getElementById("items");
const totalEl = document.getElementById("total");
const buyEl   = document.getElementById("buy");
const errEl   = document.getElementById("err");
const modeEl  = document.getElementById("mode");

let currency = "gbp";
let products = [];

function recalc() {
  const total = products.reduce((sum, p) => {
    const qty = Number(document.getElementById(`q-${p.id}`)?.value || 0);
    return sum + qty * p.amount;
  }, 0);
  totalEl.textContent = fmt(total, currency);
  buyEl.disabled = total <= 0;
}

try {
  const res = await fetch("/api/products");
  if (!res.ok) throw new Error(`Server returned ${res.status}`);
  ({ currency, products } = await res.json());

  modeEl.textContent = "Stripe test mode uses card 4242 4242 4242 4242, any future expiry, any CVC.";

  itemsEl.innerHTML = products.map(p => `
    <li>
      <label class="name" for="q-${p.id}">${p.name}<span class="brand">${p.brand} · ${p.sku}</span></label>
      <span class="price">${fmt(p.amount, currency)}</span>
      <input type="number" id="q-${p.id}" name="${p.id}" value="0" min="0" max="20" step="1"
             inputmode="numeric" aria-label="Quantity of ${p.name}">
    </li>`).join("");

  itemsEl.addEventListener("input", recalc);
  recalc();
} catch (e) {
  modeEl.textContent = `Could not load products: ${e.message}. Is the server running?`;
}

document.getElementById("shop").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  errEl.hidden = true;
  buyEl.disabled = true;
  buyEl.textContent = "Redirecting…";

  const cart = products
    .map(p => ({ id: p.id, quantity: Number(document.getElementById(`q-${p.id}`).value || 0) }))
    .filter(r => r.quantity > 0);

  try {
    const res = await fetch("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cart }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);
    window.location.assign(data.url);   // Stripe-hosted checkout
  } catch (e) {
    errEl.textContent = e.message;
    errEl.hidden = false;
    buyEl.disabled = false;
    buyEl.textContent = "Checkout with Stripe";
  }
});
</script>
</body>
</html>
